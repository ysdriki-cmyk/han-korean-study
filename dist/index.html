<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2879ec">
  <meta name="description" content="漢字と韓国語の対応テスト、韓国語の単語暗記。意味を答える・韓国語を書く、2つのモードで演習。">
  <title>한と漢 — 韓国語の演習</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/practice.css?v=3">
  <link rel="stylesheet" href="./assets/supporting.css">
  <link rel="stylesheet" href="./assets/ratings.css?v=4">
  <link rel="stylesheet" href="./assets/review.css?v=6">
  <link rel="stylesheet" href="./assets/topik.css?v=6">
  <link rel="stylesheet" href="./assets/speech.css?v=1">
  <link rel="stylesheet" href="./assets/navigation.css?v=1">
  <link rel="stylesheet" href="./assets/study-home.css?v=1">
  <script src="./assets/config.js?v=3" defer></script>
  <script type="module" src="./assets/app.js?v=29"></script>
</head>
<body data-view="home">
<a class="skip-link" href="#main">演習へ移動</a>
<header class="app-header">
  <div class="header-identity">
    <a class="brand" href="#home" aria-label="한と漢 ホーム"><span class="brand-mark">한</span><strong>한と漢</strong></a>
    <div class="course-tabs" role="group" aria-label="教材">
      <button type="button" data-deck="kanji" aria-pressed="true">한漢<span id="deck-kanji-count">650</span></button>
      <button type="button" data-deck="vocabulary" aria-pressed="false">単語<span id="deck-vocabulary-count" hidden>4,559</span></button>
    </div>
  </div>
  <span id="save-status" class="save-status">自動保存</span>
</header>
<main id="main" tabindex="-1">
  <div id="notice" class="notice" role="status" hidden></div>
  <section id="home-view" class="view study-home"><h1>学習セット</h1><p class="loading-state">読み込み中…</p></section>
  <section id="study-view" class="view" hidden>
    <h1 class="sr-only">演習</h1>
    <div class="study-set-context"><button type="button" data-view="home">← セット一覧</button><span id="active-set-label"></span></div>
    <div class="practice-stage">
      <div class="session-bar" aria-label="演習の進捗">
        <span class="session-count"><span class="session-label">進捗</span><strong id="session-done">0</strong><span class="session-divider">/</span><span id="session-total">10</span></span>
        <div class="session-progress" role="progressbar" aria-label="演習の進捗" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="session-progress"></div></div>
        <span id="session-score" class="session-score">正解 0</span>
        <button id="new-session" class="restart-button" aria-label="新しいセット" title="新しいセット"><span data-icon="refresh"></span></button>
      </div>
      <article id="flashcard" class="flashcard" aria-label="演習カード" aria-busy="true"><div class="loading-state">読み込み中…</div></article>
    </div>
  </section>
  <div class="workspace-controls" role="group" aria-label="演習メニュー" hidden>
    <div class="mode-toolbar">
      <div class="mode-switch" role="group" aria-label="演習モード">
        <button data-mode="write" aria-pressed="true"><span data-icon="pen"></span><span class="mode-copy"><strong id="write-mode-label">쓰기（漢→한）</strong></span></button>
        <button data-mode="read" aria-pressed="false"><span data-icon="book"></span><span class="mode-copy"><strong id="read-mode-label">읽기（한→漢）</strong></span></button>
      </div>
      <div class="practice-tools">
        <div class="practice-type-switch" role="group" aria-label="通常演習と復習の切り替え">
          <button type="button" data-practice-type="practice" aria-pressed="true">通常演習</button>
          <button type="button" data-practice-type="review" aria-pressed="false">復習</button>
        </div>
        <button id="open-settings" class="settings-button" aria-haspopup="dialog" aria-label="出題設定" title="出題設定"><span data-icon="sliders"></span><span>出題設定</span></button>
      </div>
    </div>
    <nav class="main-nav" aria-label="メインメニュー">
      <button class="nav-item" data-view="home"><span data-icon="layers"></span>セット</button>
      <button class="nav-item active" data-view="study"><span data-icon="cards"></span>演習</button>
      <button class="nav-item" data-view="library"><span data-icon="grid"></span>一覧<span id="nav-count" class="nav-count"></span></button>
      <button class="nav-item" data-view="progress"><span data-icon="chart"></span>記録</button>
    </nav>
  </div>
  <section id="library-view" class="view" hidden>
    <div class="page-heading"><h1 id="library-title">カード一覧</h1><span><strong id="library-total">—</strong>枚</span></div>
    <div id="rank-filters" class="status-filters" aria-label="評価で絞り込み"></div>
    <div class="library-toolbar">
      <label class="search-field"><span data-icon="search"></span><input id="library-search" type="search" aria-label="カードを検索" placeholder="検索" autocomplete="off"></label>
      <label class="check-label"><input id="library-hide" type="checkbox">答えを隠す</label>
      <button id="library-direction" class="button secondary" aria-label="隠す答えの方向">韓 → 訳</button>
    </div>
    <div class="selection-bar"><label class="check-label"><input id="select-page" type="checkbox">このページ</label><span id="selection-count">0枚選択</span><button id="queue-selected" class="button primary" disabled>選んだカードで演習</button></div>
    <div class="table-wrap"><table><thead><tr><th scope="col"><span class="sr-only">選択</span></th><th scope="col">韓国語</th><th scope="col" id="library-answer-label">日本語・英語</th><th scope="col">評価</th><th scope="col"><span class="sr-only">演習</span></th></tr></thead><tbody id="library-body"></tbody></table></div>
    <div class="pagination"><span id="page-info"></span><div><button id="prev-page" class="button secondary">← 前へ</button><button id="next-page" class="button secondary">次へ →</button></div></div>
  </section>
  <section id="progress-view" class="view" hidden>
    <div class="page-heading"><h1>学習記録</h1></div>
    <div class="record-summary"><div><span>○・◎のカード</span><strong id="settled-count">0</strong></div><div class="record-distribution"><div id="rank-distribution" class="rank-distribution"></div><strong id="settled-percent">0%</strong></div></div>
    <div id="rank-board" class="rank-board assessment-board"></div>
  </section>
</main>
<dialog id="practice-settings" aria-labelledby="settings-title">
  <div class="dialog-heading"><h2 id="settings-title">出題設定</h2><button id="close-settings" class="icon-button" aria-label="閉じる">×</button></div>
  <form id="settings-form">
    <div class="settings-content">
      <section id="settings-normal-presets" class="settings-section"><div id="settings-presets" class="settings-presets" role="group" aria-label="出題セット"></div></section>
      <section id="settings-scope-section" class="settings-section"><h3>出題範囲</h3><div id="settings-scope" class="choice-row" role="group" aria-label="出題範囲"></div></section>
      <section id="settings-normal-ratings" class="settings-section"><h3>評価から選ぶ</h3><div id="settings-ratings" class="rating-grid" role="group" aria-label="出題する評価"></div></section>
      <section id="settings-review-period" class="settings-section" hidden><h3>復習期間</h3><div id="settings-review-days" class="choice-row" role="group" aria-label="復習する履歴の期間"></div></section>
      <section class="settings-section"><h3>何枚やる？</h3><div id="settings-limit" class="choice-row" role="group" aria-label="出題枚数"></div></section>
      <section class="settings-section"><h3>出題順</h3><div id="settings-order" class="choice-row" role="group" aria-label="出題順"></div></section>
      <details id="settings-advanced" class="settings-advanced"><summary>詳細設定</summary>
        <label class="check-label due-toggle"><input id="settings-due" type="checkbox" checked>復習日が来た△・○・◎も出す</label>
        <h3>過去に間違えたカード</h3><div id="settings-mistakes" class="choice-row" role="group" aria-label="間違えた期間"></div>
        <h3>最近演習したカードを除く</h3><div id="settings-recent" class="choice-row" role="group" aria-label="最近の演習を除外"></div>
      </details>
    </div>
    <div class="settings-footer"><span class="settings-match"><strong id="settings-match">0</strong> 枚が対象</span><button id="reset-settings" type="button" class="reset-settings">初期設定</button><button id="save-settings" type="button" class="button secondary">設定だけ保存</button><button id="apply-settings" type="submit" class="button primary">演習を始める</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
