<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#80d8ff">
  <meta name="description" content="漢字と韓国語の対応テスト、韓国語の単語暗記。意味を答える・韓国語を書く、2つのモードで演習。">
  <title>한と漢 — 韓国語の演習</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/practice.css">
  <script src="./assets/config.js" defer></script>
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">演習へ移動</a>
<header class="app-header">
  <a class="brand" href="#study" aria-label="한と漢 演習"><span class="brand-mark">한</span><strong>한と漢</strong></a>
  <nav class="main-nav" aria-label="メインメニュー">
    <button class="nav-item active" data-view="study">演習</button>
    <button class="nav-item" data-view="library">一覧<span id="nav-count" class="nav-count"></span></button>
    <button class="nav-item" data-view="progress">記録</button>
  </nav>
  <span id="save-status" class="save-status">自動保存</span>
</header>
<main id="main" tabindex="-1">
  <div id="notice" class="notice" role="status" hidden></div>
  <div class="course-tabs" role="group" aria-label="教材">
    <button data-deck="kanji" aria-pressed="false">漢字対応<span id="deck-kanji-count">650</span></button>
    <button data-deck="vocabulary" aria-pressed="true">単語暗記<span id="deck-vocabulary-count">4,559</span></button>
  </div>
  <section id="study-view" class="view">
    <h1 class="sr-only">演習</h1>
    <div class="mode-toolbar">
      <div class="mode-switch" role="group" aria-label="演習モード">
        <button data-mode="read" aria-pressed="true"><span>意味を答える</span><small id="read-mode-caption">韓国語 → 日本語・英語</small></button>
        <button data-mode="write" aria-pressed="false"><span>韓国語を書く</span><small id="write-mode-caption">日本語・英語 → 韓国語</small></button>
      </div>
      <button id="open-settings" class="settings-button" aria-haspopup="dialog" aria-label="出題設定" title="出題設定"><span data-icon="sliders"></span><span>出題設定</span></button>
    </div>
    <article id="flashcard" class="flashcard" aria-label="演習カード" aria-busy="true"><div class="loading-state">読み込み中…</div></article>
    <div class="session-bar" aria-label="演習の進捗">
      <div class="session-progress"><div id="session-progress"></div></div>
      <span><strong id="session-done">0</strong> / <span id="session-total">10</span></span>
      <span id="session-score">正解 0</span>
      <button id="new-session" class="text-button"><span data-icon="refresh"></span>新しいセット</button>
    </div>
  </section>
  <section id="library-view" class="view" hidden>
    <div class="page-heading"><h1>カード一覧</h1><span><strong id="library-total">—</strong>枚</span></div>
    <div id="rank-filters" class="rank-filters" aria-label="ランクで絞り込み"></div>
    <div class="library-toolbar">
      <label class="search-field"><span data-icon="search"></span><input id="library-search" type="search" aria-label="カードを検索" placeholder="検索" autocomplete="off"></label>
      <label class="check-label"><input id="library-hide" type="checkbox">答えを隠す</label>
      <button id="library-direction" class="button secondary" aria-label="隠す答えの方向">韓 → 訳</button>
    </div>
    <div class="selection-bar"><label class="check-label"><input id="select-page" type="checkbox">このページ</label><span id="selection-count">0枚選択</span><button id="queue-selected" class="button primary" disabled>選んだカードで演習</button></div>
    <div class="table-wrap"><table><thead><tr><th scope="col"><span class="sr-only">選択</span></th><th scope="col">韓国語</th><th scope="col" id="library-answer-label">日本語・英語</th><th scope="col">ランク</th><th scope="col"><span class="sr-only">演習</span></th></tr></thead><tbody id="library-body"></tbody></table></div>
    <div class="pagination"><span id="page-info"></span><div><button id="prev-page" class="button secondary">← 前へ</button><button id="next-page" class="button secondary">次へ →</button></div></div>
  </section>
  <section id="progress-view" class="view" hidden>
    <div class="page-heading"><h1>学習記録</h1></div>
    <div class="record-summary"><div><span>覚えたカード</span><strong id="settled-count">0</strong></div><div class="record-distribution"><div id="rank-distribution" class="rank-distribution"></div><strong id="settled-percent">0%</strong></div></div>
    <div id="rank-board" class="rank-board"></div>
  </section>
</main>
<dialog id="practice-settings">
  <div class="dialog-heading"><h2>出題設定</h2><button id="close-settings" class="icon-button" aria-label="閉じる">×</button></div>
  <form id="settings-form">
    <label class="field-label" for="practice-filter">範囲</label>
    <select id="practice-filter"><option value="all">すべて</option><option value="review">復習（テスト待ち・練習中）</option><optgroup label="ランク"><option value="required">優先</option><option value="next">次に学ぶ</option><option value="later">あとで</option><option value="manji">テスト待ち</option><option value="fair">練習中</option><option value="mastered">覚えた</option><option value="read">読むテスト済み</option><option value="read2">定着</option></optgroup></select>
    <label class="field-label" for="session-limit">枚数</label>
    <select id="session-limit"><option value="10">10枚</option><option value="20">20枚</option><option value="50">50枚</option><option value="all">すべて</option></select>
    <label class="check-label shuffle-label"><input id="shuffle" type="checkbox">ランダムに出題</label>
    <button type="submit" class="button primary">適用する</button>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
